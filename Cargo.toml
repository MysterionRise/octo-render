[workspace]
resolver = "2"
members = [
    ".",
    "crates/core",
    "crates/asset",
    "crates/gpu",
    "crates/renderer",
    "crates/app",
]

[package]
name = "octo-render"
version = "0.1.0"
edition = "2021"

[lib]
name = "renderer"
path = "src/renderer.rs"

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
image = "0.25"
glam = "0.32"

[dev-dependencies]
criterion = "0.5"
rand = "0.8"

[[bench]]
name = "line_benchmark"
harness = false
