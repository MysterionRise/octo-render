[workspace]
resolver = "2"
members = [
    ".",
    "crates/core",
    "crates/asset",
    "crates/gpu",
    "crates/renderer",
    "crates/app",
]

[package]
name = "octo-render"
version = "0.1.0"
edition = "2021"

[lib]
name = "renderer"
path = "src/renderer.rs"

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
# Only the codecs the renderer reads and writes: PNG output, PPM/TGA/JPEG/PNG
# textures. Default features would also build AVIF (rav1e), EXR, TIFF, WebP, GIF.
image = { version = "0.25", default-features = false, features = ["png", "pnm", "tga", "jpeg"] }
glam = "0.32"

[dev-dependencies]
criterion = "0.5"
rand = "0.8"

[[bench]]
name = "line_benchmark"
harness = false
