name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Kernel dependency rule
        run: |
          if cargo tree -p colony-sim -e normal | grep -E '(^|[ ─])(wgpu|winit|glam) '; then
            echo "colony-sim must not depend on wgpu, winit, or glam"
            exit 1
          fi
